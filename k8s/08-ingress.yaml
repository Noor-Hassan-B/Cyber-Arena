apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegishunt-ingress
  namespace: threat-hunting
  labels:
    app.kubernetes.io/name: aegishunt
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: aegishunt.local
      http:
        paths:
          # API route targeting PHP backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          # Frontend route targeting React + Nginx
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
