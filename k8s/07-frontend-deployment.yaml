apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: threat-hunting
  labels:
    app: aegishunt-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegishunt-frontend
  template:
    metadata:
      labels:
        app: aegishunt-frontend
    spec:
      containers:
        - name: react-nginx
          image: aegishunt-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: threat-hunting
  labels:
    app: aegishunt-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: aegishunt-frontend
