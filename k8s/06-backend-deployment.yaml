apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: threat-hunting
  labels:
    app: aegishunt-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegishunt-backend
  template:
    metadata:
      labels:
        app: aegishunt-backend
    spec:
      containers:
        - name: php-api
          image: aegishunt-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: aegishunt-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: aegishunt-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: aegishunt-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: aegishunt-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: aegishunt-secrets
                  key: DB_PASS
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/scenarios
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/scenarios
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: threat-hunting
  labels:
    app: aegishunt-backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: aegishunt-backend
