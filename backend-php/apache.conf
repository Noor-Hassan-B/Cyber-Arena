<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # Route /api/events -> /api/events.php
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{DOCUMENT_ROOT}/api/$1.php -f
        RewriteRule ^api/([a-zA-Z0-9_-]+)$ api/$1.php [L,QSA]
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/threat_hunter_error.log
    CustomLog ${APACHE_LOG_DIR}/threat_hunter_access.log combined
</VirtualHost>
